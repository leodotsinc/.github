name: Maintenance contracts
on:
  push:
    paths: ['renovate/**', 'renovate.json', 'actions/maintenance-scan/**', '.github/workflows/maintenance-check.yml']
  pull_request:
    paths: ['renovate/**', 'renovate.json', 'actions/maintenance-scan/**', '.github/workflows/maintenance-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintenance-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.1'
          package-manager-cache: false
      - run: npx --yes --package=renovate@44.104.2 renovate-config-validator --strict renovate/maintenance.json
      - run: python3 -m unittest discover -s actions/maintenance-scan -p 'test_*.py' -v
