name: Cloudbox deployment reconciliation

on:
  workflow_call:
    inputs:
      app_id:
        description: Cloudbox application id registered by the destination repository.
        required: true
        type: string
      result_artifact:
        description: Artifact containing the sanitized verified deployment result.
        required: true
        type: string
      result_file:
        description: Sanitized result filename inside the artifact.
        required: false
        default: deployment-result.json
        type: string
      source_sha:
        description: Exact source commit verified in production.
        required: true
        type: string
      app_client_id:
        description: Client ID of the destination-only GitHub App.
        required: true
        type: string
    secrets:
      app_private_key:
        required: true

permissions:
  actions: read
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download sanitized deployment result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.result_artifact }}
          path: deployment-result

      - name: Bind result to the calling repository and encode receipt
        id: receipt
        env:
          APP_ID: ${{ inputs.app_id }}
          RESULT_FILE: ${{ inputs.result_file }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import base64
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import re

          services = {
              "pluggy-mcp": {
                  "repository": "leodots/pluggy-mcp",
                  "source": "https://github.com/leodots/pluggy-mcp",
                  "image": "ghcr.io/leodots/pluggy-mcp@sha256:",
                  "kind": "single",
              },
              "blog": {
                  "repository": "leodotsinc/blog",
                  "source": "https://github.com/leodotsinc/blog",
                  "image": "ghcr.io/leodotsinc/blog@sha256:",
                  "kind": "single",
              },
              "meeting-ai": {
                  "repository": "leodotsinc/meeting-ai",
                  "source": "https://github.com/leodotsinc/meeting-ai",
                  "image": "ghcr.io/leodotsinc/meeting-ai@sha256:",
                  "kind": "single",
              },
              "gamedex-hq": {
                  "repository": "leodots/gamedex-hq",
                  "source": "https://github.com/leodots/gamedex-hq",
                  "kind": "image_set",
                  "images": {
                      "api": "ghcr.io/leodots/gamedex-hq-api@sha256:",
                      "web": "ghcr.io/leodots/gamedex-hq-web@sha256:",
                      "ceo": "ghcr.io/leodots/gamedex-hq-ceo@sha256:",
                      "ceo_egress": "ghcr.io/leodots/gamedex-hq-ceo-egress@sha256:",
                  },
              },
          }
          app = os.environ["APP_ID"]
          config = services.get(app)
          if config is None or os.environ["GITHUB_REPOSITORY"] != config["repository"]:
              raise SystemExit("caller repository is not registered for this application")
          sha = os.environ["SOURCE_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("invalid source SHA")
          path = Path("deployment-result") / os.environ["RESULT_FILE"]
          raw = path.read_bytes()
          if not 1 <= len(raw) <= 65536:
              raise SystemExit("invalid deployment-result size")
          result = json.loads(raw)
          if (not isinstance(result, dict) or result.get("app") != app
                  or result.get("ok") is not True or result.get("status") != "verified"
                  or result.get("ssh_exit_code", 0) != 0):
              raise SystemExit("deployment result is not verified")
          digest = re.compile(r"[0-9a-f]{64}")
          if config["kind"] == "single":
              release = result.get("release", {})
              deployment = release.get("deployment", {})
              image = release.get("image")
              if not (release.get("service") == app
                      and release.get("source_repository") == config["source"]
                      and release.get("git_sha") == sha
                      and isinstance(image, str) and image.startswith(config["image"])
                      and digest.fullmatch(image.removeprefix(config["image"]))
                      and deployment.get("status") == "verified"
                      and deployment.get("observed_image") == image
                      and isinstance(deployment.get("verified_at"), str)
                      and deployment["verified_at"].endswith("Z")):
                  raise SystemExit("deployment result does not prove this release")
              if app == "pluggy-mcp" and result.get("server_info") != {
                      "name": "pluggy", "version": release.get("release_version")}:
                  raise SystemExit("MCP server identity differs from release")
              verified_at = deployment["verified_at"]
          else:
              images = result.get("images")
              if not (result.get("sha") == sha and result.get("probes") is True
                      and isinstance(images, dict) and set(images) == set(config["images"])):
                  raise SystemExit("HQ result does not prove the requested image set")
              for role, prefix in config["images"].items():
                  image = images[role]
                  if not (isinstance(image, str) and image.startswith(prefix)
                          and digest.fullmatch(image.removeprefix(prefix))):
                      raise SystemExit(f"invalid HQ {role} image")
              verified_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          envelope = {
              "schema_version": 1,
              "app": app,
              "source_repository": config["source"],
              "source_sha": sha,
              "source_run_id": os.environ["GITHUB_RUN_ID"],
              "verified_at": verified_at,
              "deployment_result": result,
          }
          encoded = base64.b64encode(json.dumps(
              envelope, separators=(",", ":"), sort_keys=True).encode()).decode()
          if len(encoded) > 131072:
              raise SystemExit("encoded deployment receipt exceeds limit")
          request_id = f"{app}-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"value={encoded}\nrequest_id={request_id}\n")
          PY

      - name: Mint destination-only workflow token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app_client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: leodots
          repositories: vps-bootstrap
          permission-actions: write

      - name: Request and wait for vps-bootstrap reconciliation
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RECEIPT_B64: ${{ steps.receipt.outputs.value }}
          REQUEST_ID: ${{ steps.receipt.outputs.request_id }}
        run: |
          set -euo pipefail
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - <<'PY' | gh api \
            repos/leodots/vps-bootstrap/actions/workflows/reconcile-deployment.yml/dispatches \
            --method POST --input -
          import json
          import os
          print(json.dumps({"ref": "main", "inputs": {
              "request_id": os.environ["REQUEST_ID"],
              "result_b64": os.environ["RECEIPT_B64"],
          }}))
          PY
          run_id=""
          for _ in $(seq 1 60); do
            run_id="$(gh api \
              'repos/leodots/vps-bootstrap/actions/workflows/reconcile-deployment.yml/runs?event=workflow_dispatch&per_page=50' \
              --jq ".workflow_runs[] | select(.display_title == \"Reconcile $REQUEST_ID\" and .created_at >= \"$started\") | .id" \
              | head -n 1)"
            test -n "$run_id" && break
            sleep 2
          done
          test -n "$run_id"
          gh run watch "$run_id" -R leodots/vps-bootstrap --exit-status
