name: Cloudbox deploy

on:
  workflow_call:
    outputs:
      result_artifact:
        description: Sanitized deployment evidence for this run attempt.
        value: ${{ jobs.deploy.outputs.result_artifact }}
    inputs:
      app_id:
        description: Server-side allowlisted application id.
        required: true
        type: string
      release_artifact:
        description: Artifact containing the immutable release manifest.
        required: true
        type: string
      release_file:
        description: Manifest filename inside the downloaded artifact.
        required: false
        default: release.json
        type: string
      maintenance_artifact:
        description: Optional same-run registered application maintenance identity artifact.
        required: false
        default: ''
        type: string
      maintenance_file:
        description: Fixed context filename within the maintenance artifact.
        required: false
        default: maintenance-context.json
        type: string
      vps_host:
        required: true
        type: string
      ssh_port:
        required: true
        type: string
      deploy_user:
        required: true
        type: string
      release_sha:
        description: Source commit that must still be the caller repository main.
        required: true
        type: string
    secrets:
      deploy_key:
        required: true
      known_hosts:
        required: true

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      result_artifact: ${{ inputs.app_id }}-deployment-result-${{ github.run_id }}-${{ github.run_attempt }}
    concurrency:
      group: cloudbox-${{ inputs.app_id }}-production
      cancel-in-progress: false
    steps:
      - name: Require release source to remain current main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" == "$RELEASE_SHA" ]]

      - name: Validate optional maintenance artifact identity
        if: inputs.maintenance_artifact != ''
        env:
          APP_ID: ${{ inputs.app_id }}
          ARTIFACT_NAME: ${{ inputs.maintenance_artifact }}
          ARTIFACT_FILE: ${{ inputs.maintenance_file }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          [[ "$APP_ID" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]] || exit 1
          case "$APP_ID" in
            pluggy-mcp) test "$ARTIFACT_NAME" = pluggy-maintenance-context ;;
            *) test "$ARTIFACT_NAME" = "$APP_ID-maintenance-context" ;;
          esac
          test "$ARTIFACT_FILE" = maintenance-context.json

      - name: Download same-run maintenance context
        if: inputs.maintenance_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.maintenance_artifact }}
          path: maintenance-artifact

      - name: Download immutable release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_artifact }}
          path: release-artifact

      - name: Deploy through app-specific gateway
        uses: leodotsinc/.github/actions/cloudbox-deploy@76a15c62a4f019febef9fcee811e6dca6ac7d9a6
        with:
          app-id: ${{ inputs.app_id }}
          release-file: release-artifact/${{ inputs.release_file }}
          maintenance-file: ${{ inputs.maintenance_artifact != '' && 'maintenance-artifact/maintenance-context.json' || '' }}
          vps-host: ${{ inputs.vps_host }}
          ssh-port: ${{ inputs.ssh_port }}
          deploy-user: ${{ inputs.deploy_user }}
          deploy-key: ${{ secrets.deploy_key }}
          known-hosts: ${{ secrets.known_hosts }}
          registry-token: ${{ github.token }}
          registry-username: ${{ github.actor }}
          result-file: deployment-result.json

      - name: Upload sanitized deployment evidence
        if: always() && hashFiles('deployment-result.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.app_id }}-deployment-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment-result.json
          if-no-files-found: error
          retention-days: 30
