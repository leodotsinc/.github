name: Deploy transport CI

on:
  push:
    paths:
      - "actions/cloudbox-deploy/**"
      - ".github/workflows/deploy-transport-ci.yml"
  pull_request:
    paths:
      - "actions/cloudbox-deploy/**"
      - ".github/workflows/deploy-transport-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest actions/cloudbox-deploy/test_send.py
